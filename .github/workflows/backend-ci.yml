name: Docker Build and Push to Docker Hub

on:
  push:
    branches: ['develop']

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - uses: actions/checkout@v4

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login to Docker Hub using secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # 4. Build and push Docker image to Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            kirandhakal/pms-backend:latest
            kirandhakal/pms-backend:${{ github.sha }}
            kirandhakal/pms-backend:stable
          cache-from: type=registry,ref=kirandhakal/pms-backend:buildcache
          cache-to: type=registry,ref=kirandhakal/pms-backend:buildcache,mode=max
