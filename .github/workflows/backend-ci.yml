name: Kanban CI/CD
on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kanban-${{ github.ref }}
  cancel-in-progress: false
env:
  IMAGE: kirandhakal/pms-backend
  DEPLOY_PATH: /var/www/kanban-backend
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:chat
      - run: npm run test:projects
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.prod.yml
          target: ${{ env.DEPLOY_PATH }}
      - uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ env.IMAGE }}
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE,IMAGE_TAG,DEPLOY_PATH
          command_timeout: 15m
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            test -f .env.docker
            chmod 600 .env.docker
            dc() {
              sudo -n env IMAGE="$IMAGE" IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.prod.yml --env-file .env.docker "$@"
            }
            dc config --quiet
            dc pull backend
            dc run --rm --no-deps backend node node_modules/typeorm/cli.js migration:run -d dist/config/data-source.js
            if ! dc up -d --no-build --wait --wait-timeout 120; then
              dc ps
              dc logs --tail=100 backend
              exit 1
            fi
            dc ps
